{
  "schema_version": "qlh.docagent.rules.v1",
  "ruleset_version": 1,
  "name": "QLH document maintenance rules",
  "description": "Initial data representation of the existing R1-R5 maintenance scanner contract.",
  "defaults": {
    "status_window_lines": 12,
    "body_window_lines": 200,
    "levels": ["info", "warn", "error"]
  },
  "exemptions": {
    "status_contains": [
      "历史参考",
      "待拆分",
      "不作为当前能力",
      "已废弃",
      "废弃",
      "冻结",
      "历史记录"
    ]
  },
  "rules": [
    {
      "id": "R1",
      "name": "完成未收口",
      "level": "warn",
      "enabled": true,
      "description": "状态行含未收口词，但正文前段已经出现完成标记。",
      "parameters": {
        "stale_status_hints": ["规划", "Candidate", "Blocked"],
        "done_markers": ["✅", "Completed", "已完成", "已关闭", "已验收", "开发门完成", "阶段 2 完成", "完成（"],
        "ignore_status_done_markers": true,
        "status_stem_parentheses": true
      }
    },
    {
      "id": "R2",
      "name": "未提交登记",
      "level": "warn",
      "enabled": true,
      "description": "当前文档存在工作区未提交改动，需确认是否已登记或应进入变更记录。",
      "parameters": {
        "git_scope": "docs/",
        "only_current_document": true
      }
    },
    {
      "id": "R3",
      "name": "状态行滞后",
      "level": "info",
      "enabled": true,
      "description": "文档更新日期早于保守关联的 src/ 代码提交，提示人工复核状态行。",
      "parameters": {
        "source_root": "src/",
        "match_mode": "path_prefix_or_filename_token",
        "ignore_commit_subject": true,
        "topic_stop_words": ["agent", "audit", "candidate", "completed", "design", "development", "document", "implementation", "maintenance", "model", "plan", "planning", "project", "status", "support", "tool", "update"]
      }
    },
    {
      "id": "R4",
      "name": "链接失效",
      "level": "warn",
      "enabled": true,
      "description": "文档中的仓库内相对 Markdown 链接找不到目标文件。",
      "parameters": {
        "relative_root": "docs/",
        "ignored_schemes": ["http://", "https://", "#", "mailto:"],
        "decode_url_path": true
      }
    },
    {
      "id": "R5",
      "name": "状态行缺失",
      "level": "info",
      "enabled": true,
      "description": "文档前 12 行没有状态行，提示补充或声明豁免。",
      "parameters": {
        "status_pattern": "(?:\\*\\*)?状态(?:\\*\\*)?[:：]",
        "ignore_lifecycle_heading": true,
        "lifecycle_pattern": "文档生命周期"
      }
    }
  ]
}
